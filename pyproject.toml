[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "araeval"
version = "0.1.0"
description = "Generic evaluation runner for Arabic-capable (small) language models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "datasets>=4.0",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "sacrebleu>=2.4",
  "transformers>=4.57",
  "torch>=2.4",
  "accelerate>=1.0",
]

[project.optional-dependencies]
vllm = ["vllm>=0.11"]
judge = ["anthropic>=1.0", "openai>=1.50"]
quant = ["bitsandbytes"]
all = ["vllm>=0.11", "anthropic>=1.0", "openai>=1.50", "bitsandbytes"]

[project.scripts]
araeval = "araeval.cli:main"

[tool.setuptools.packages.find]
include = ["araeval*"]
