# araeval task registry: one entry per evaluation task.
# Field mappings use the real Hub column names (checked 2026-10-21 via the datasets-server API).
# Add a dataset = add an entry here (see README "Adding a dataset"). `tags: [core]` = proposed core suite.
tasks:

# ---------------------------------------------------------------- Knowledge & exams
- name: arabicmmlu
  source_name: ArabicMMLU
  hf_id: MBZUAI/ArabicMMLU
  type: mcq
  category: Knowledge & exams
  configs: [All]
  split: test
  fewshot_split: dev
  fields: {question: Question, context: Context, choices: [Option 1, Option 2, Option 3, Option 4, Option 5], answer: Answer Key, answer_format: letter}
  group_by: Subject
  tags: [knowledge]

- name: arabicmmlu_verified
