- name: qalb_gec
  source_name: QALB 2015 (L2)
  hf_id: RanaGaber/QALB-2015-L2
  type: generate
  category: Linguistic competence
  split: test
  preprocess: qalb
  instruction: "صحّح الأخطاء الإملائية والنحوية في النص التالي، وأعد كتابته كاملاً دون أي تعليق:"
  metrics: [chrf, f1]
  primary_metric: chrf
  max_new_tokens: 768
  requires: instruct
  needs_check: chrF/F1 against the corrected text approximate, but do not equal, the official M2 F1
  tags: [linguistic]

- name: fann_or_flop_explain
  source_name: Fann or Flop
  hf_id: omkarthawakar/FannOrFlop
  type: judge
  category: Linguistic competence
  split: train
  preprocess: fann_or_flop
  instruction: "اشرح القصيدة التالية شرحاً وافياً، مبيّناً المعاني والصور البلاغية:"
  judge_rubric: poetry_explanation
  max_new_tokens: 1500
  limit: 200
  requires: instruct
  tags: [linguistic, poetry, judge]

